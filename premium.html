<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f3f3;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:700px;
    background:#fff;
    border-radius:10px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.breadcrumb{
    color:#777;
    font-size:14px;
    margin-bottom:15px;
}

.product{
    display:flex;
    gap:30px;
    align-items:center;
}

.left img{
    width:220px;
}

.right{
    flex:1;
}

.right h2{
    margin-bottom:8px;
}

.rating{
    color:#ffc107;
    margin-bottom:12px;
}

.rating span{
    color:#666;
    margin-left:5px;
    font-size:14px;
}

.right h1{
    color:#28a745;
    margin-bottom:15px;
    font-size:36px;
}

.right ul{
    list-style:none;
    margin-bottom:25px;
}

.right ul li{
    margin:10px 0;
    color:#444;
}

.right ul li::before{
    content:"✔ ";
    color:#28a745;
}

.bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.qty{
    display:flex;
    border:1px solid #ccc;
    border-radius:5px;
    overflow:hidden;
}

.qty button{
    width:40px;
    height:40px;
    border:none;
    background:#f5f5f5;
    cursor:pointer;
    font-size:18px;
}

.qty span{
    width:40px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.cart-btn{
    background:#28a745;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.cart-btn:hover{
    background:#218838;
}
    </style>
</head>
<body>
    <div class="card">

    <div class="breadcrumb">
        Home > Electronics > Smart Watch X1
    </div>

    <div class="product">

        <div class="left">
            <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fHdhdGNofGVufDB8fDB8fHww" alt="Smart Watch">
        </div>

        <div class="right">
            <h2>Smart Watch X1</h2>

            <div class="rating">
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star-half-alt"></i>
                <span>(15 million Reviews)</span>
            </div>
             <h1>2,999/h1>

            <ul>
                <li>1.4" AMOLED Display</li>
                <li>Heart Rate Monitor</li>
                <li>5 ATM Water Resistant</li>
                <li>7 Days Battery Life</li>
            </ul>

            <div class="bottom">

                <div class="qty">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <button class="cart-btn">
                    Add to Cart
                </button>

            </div>

        </div>

    </div>

</div>
</body>
</html>
